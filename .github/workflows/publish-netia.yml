# Publie le package Python NetIA sur PyPI.
#
# Déclenchement : pousser un tag « netia-vX.Y.Z » dont la version correspond à
# celle de netia/pyproject.toml, par exemple :
#   git tag netia-v0.2.0 && git push origin netia-v0.2.0
#
# Authentification : « Trusted Publishing » (OIDC). Aucun jeton n'est stocké
# dans le dépôt ; PyPI fait confiance à ce workflow précis, déclaré une fois sur
# https://pypi.org/manage/account/publishing/
name: Publier NetIA sur PyPI

on:
  push:
    tags: ["netia-v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: netia

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#netia-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Le tag ($tag) ne correspond pas à la version de pyproject.toml ($version)"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: netia/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/netia-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netia/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
